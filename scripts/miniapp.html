<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel Pipeline</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Warna mengikuti tema Telegram (themeParams); fallback dipakai saat halaman
     dibuka di browser biasa untuk debugging. */
  :root {
    --bg:      var(--tg-theme-bg-color, #ffffff);
    --bg2:     var(--tg-theme-secondary-bg-color, #f2f2f7);
    --fg:      var(--tg-theme-text-color, #10151b);
    --muted:   var(--tg-theme-hint-color, #7d8b99);
    --link:    var(--tg-theme-link-color, #2b7fd4);
    --btn:     var(--tg-theme-button-color, #2b7fd4);
    --btn-fg:  var(--tg-theme-button-text-color, #ffffff);
    --ok:      #2fa36b;
    --err:     #e0483e;
    --warn:    #d9911f;
    --radius:  14px;
    --line:    color-mix(in srgb, var(--muted) 28%, transparent);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    padding: 0 14px calc(24px + env(safe-area-inset-bottom));
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  }
  h1, h2, h3 { margin: 0; font-weight: 600; }
  code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

  header { padding: 14px 0 10px; display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 17px; }
  header .who { margin-left: auto; font-size: 12px; color: var(--muted); text-align: right; }

  /* ── Tab ─────────────────────────────────────────────────────────────── */
  .tabs {
    display: flex; gap: 2px; padding: 2px; margin-bottom: 14px;
    background: var(--bg2); border-radius: 10px;
    position: sticky; top: 0; z-index: 5;
  }
  .tabs button {
    flex: 1; border: 0; padding: 8px 4px; border-radius: 8px;
    background: transparent; color: var(--muted);
    font: inherit; font-size: 14px; font-weight: 500; cursor: pointer;
    transition: background .15s, color .15s;
  }
  .tabs button[aria-selected="true"] {
    background: var(--bg); color: var(--fg);
    box-shadow: 0 1px 3px rgba(0,0,0,.12);
  }
  section[hidden] { display: none; }

  /* ── Kartu ───────────────────────────────────────────────────────────── */
  .card {
    background: var(--bg2); border-radius: var(--radius);
    padding: 14px; margin-bottom: 12px;
  }
  .card .top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .card h2 { font-size: 15px; }
  .card .sub { font-size: 13px; color: var(--muted); }
  .meta { margin-top: 10px; font-size: 12px; color: var(--muted); display: grid; gap: 3px; }
  .meta b { font-weight: 500; color: var(--fg); opacity: .8; }
  .meta code { font-size: 11px; background: color-mix(in srgb, var(--muted) 16%, transparent);
               padding: 1px 5px; border-radius: 5px; }

  .pill {
    margin-left: auto; font-size: 11px; font-weight: 600; letter-spacing: .02em;
    padding: 3px 9px; border-radius: 999px; white-space: nowrap;
    background: color-mix(in srgb, var(--muted) 20%, transparent); color: var(--muted);
  }
  .pill.ok   { background: color-mix(in srgb, var(--ok) 18%, transparent);   color: var(--ok); }
  .pill.err  { background: color-mix(in srgb, var(--err) 18%, transparent);  color: var(--err); }
  .pill.run  { background: color-mix(in srgb, var(--link) 18%, transparent); color: var(--link); }
  .pill.warn { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
  .pill.run::before {
    content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 5px;
    border-radius: 50%; background: currentColor; animation: pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: .25; } 50% { opacity: 1; } }

  /* ── Kontrol ─────────────────────────────────────────────────────────── */
  label.field { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 5px; }
  input[type=text], select {
    width: 100%; padding: 10px 12px; font: inherit; font-size: 14px;
    color: var(--fg); background: var(--bg); border: 1px solid var(--line);
    border-radius: 10px; appearance: none;
  }
  input[type=text]:focus, select:focus { outline: 2px solid var(--link); outline-offset: -1px; }

  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip {
    padding: 7px 12px; border-radius: 999px; font-size: 13px; cursor: pointer;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg);
    transition: background .12s, border-color .12s, color .12s;
  }
  .chip[aria-pressed="true"] { background: var(--btn); border-color: var(--btn); color: var(--btn-fg); }
  .chip.all[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--bg); }

  button.action {
    width: 100%; margin-top: 14px; padding: 12px; border: 0; border-radius: 11px;
    background: var(--btn); color: var(--btn-fg); font: inherit; font-weight: 600;
    cursor: pointer;
  }
  button.action:disabled { opacity: .5; cursor: default; }
  button.ghost {
    border: 1px solid var(--line); background: transparent; color: var(--fg);
    padding: 7px 12px; border-radius: 9px; font: inherit; font-size: 13px; cursor: pointer;
  }
  .row { display: flex; align-items: center; gap: 8px; }
  .row .grow { flex: 1; }

  /* ── Log ─────────────────────────────────────────────────────────────── */
  pre.log {
    margin: 10px 0 0; padding: 12px; max-height: 62vh; overflow: auto;
    background: var(--bg2); border-radius: var(--radius);
    font-size: 11.5px; line-height: 1.5; white-space: pre-wrap; word-break: break-word;
  }
  pre.log .e { color: var(--err); }
  pre.log .w { color: var(--warn); }
  pre.log .t { color: var(--muted); }

  .empty { padding: 26px 14px; text-align: center; color: var(--muted); font-size: 13px; }
  .skeleton { height: 74px; border-radius: var(--radius); background: var(--bg2);
              margin-bottom: 12px; animation: pulse 1.4s ease-in-out infinite; }
  .toast {
    position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom));
    transform: translate(-50%, 130%); max-width: 88%;
    padding: 10px 16px; border-radius: 999px; font-size: 13px;
    background: var(--fg); color: var(--bg); opacity: 0;
    transition: transform .22s ease, opacity .22s ease; z-index: 20;
  }
  .toast.show { transform: translate(-50%, 0); opacity: .95; }
</style>
</head>
<body>

<header>
  <h1>Panel Pipeline</h1>
  <div class="who" id="who"></div>
</header>

<div class="tabs" role="tablist">
  <button role="tab" data-tab="status"  aria-selected="true">Status</button>
  <button role="tab" data-tab="run"     aria-selected="false">Jalankan</button>
  <button role="tab" data-tab="logs"    aria-selected="false">Log</button>
</div>

<section id="tab-status">
  <div id="cards"><div class="skeleton"></div><div class="skeleton"></div></div>
</section>

<section id="tab-run" hidden>
  <div class="tabs" style="position:static;margin-bottom:12px">
    <button role="tab" data-job="split" aria-selected="true">split</button>
    <button role="tab" data-job="dbt"   aria-selected="false">dbt</button>
    <button role="tab" data-job="sync"  aria-selected="false">sync</button>
  </div>

  <div class="card" id="pane-split">
    <div class="top"><h2>split-excel</h2><span class="pill" id="pill-split">—</span></div>
    <div class="sub">Ambil .xlsx dari Nextcloud, pecah per sheet, unggah ke folder tujuan.</div>
    <label class="field">Folder sumber</label>
    <div class="chips" id="chips-split"></div>
    <div class="sub" id="hint-split" style="margin-top:9px"></div>
  </div>

  <div class="card" id="pane-dbt" hidden>
    <div class="top"><h2>dbt</h2><span class="pill" id="pill-dbt">—</span></div>
    <div class="sub">Jalankan perintah dbt di container <code>dbt-runner</code>.</div>
    <label class="field" for="dbt-cmd">Perintah</label>
    <select id="dbt-cmd">
      <option value="run">run</option>
      <option value="test">test</option>
      <option value="build">build</option>
      <option value="deps">deps</option>
      <option value="debug">debug</option>
    </select>
    <label class="field" for="dbt-select">--select <span style="opacity:.7">(opsional)</span></label>
    <input type="text" id="dbt-select" placeholder="mis. mart_capil atau stg_*_finance_rekap"
           autocapitalize="off" autocorrect="off" spellcheck="false">
  </div>

  <div class="card" id="pane-sync" hidden>
    <div class="top"><h2>Airbyte</h2><span class="pill" id="pill-sync">—</span></div>
    <div class="sub">Picu sync satu koneksi. Hasilnya dilaporkan lewat webhook Airbyte ke grup.</div>
    <div id="sync-body"></div>
  </div>
</section>

<section id="tab-logs" hidden>
  <div class="row">
    <div class="tabs grow" style="position:static;margin:0">
      <button role="tab" data-log="split" aria-selected="true">split</button>
      <button role="tab" data-log="dbt"   aria-selected="false">dbt</button>
    </div>
    <button class="ghost" id="log-auto" aria-pressed="true">Auto ⟳</button>
  </div>
  <pre class="log" id="log">memuat…</pre>
</section>

<div class="toast" id="toast"></div>

<script>
"use strict";
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); if (tg.enableClosingConfirmation) tg.enableClosingConfirmation(); }

const $  = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const buzz = (style) => { try { tg.HapticFeedback.impactOccurred(style || "light"); } catch (_) {} };
const notify = (type) => { try { tg.HapticFeedback.notificationOccurred(type); } catch (_) {} };

let toastTimer;
function toast(msg) {
  const el = $("#toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}

/* ── API ─────────────────────────────────────────────────────────────────
   initData dikirim apa adanya di header; server yang memverifikasi HMAC-nya.
   Jangan pernah percaya initDataUnsafe untuk otorisasi — itu hanya untuk
   menampilkan nama di pojok kanan atas. */
const INIT_DATA = (tg && tg.initData) || "";
let fatal = false;

/* Basis API dihitung dari lokasi halaman, bukan "/" mati: relay bisa saja
   dilayani di balik reverse proxy pada subpath (mis. /panel/app). */
const API_BASE = location.pathname.replace(/\/app\/?$/, "") + "/api/";

async function api(path, opts = {}) {
  const res = await fetch(API_BASE + path, {
    ...opts,
    headers: {
      "Content-Type": "application/json",
      "X-Telegram-Init-Data": INIT_DATA,
      ...(opts.headers || {}),
    },
  });
  let body = null;
  try { body = await res.json(); } catch (_) { /* biarkan null */ }
  if (res.status === 401 || res.status === 403) {
    fatal = true;
    document.body.innerHTML =
      '<div class="empty" style="padding-top:80px">🔒<br><br>' +
      esc((body && body.error) || "Akses ditolak.") + "</div>";
    throw new Error("unauthorized");
  }
  if (!res.ok) throw new Error((body && body.error) || ("HTTP " + res.status));
  return body;
}

/* ── Format ──────────────────────────────────────────────────────────── */
function durasi(detik) {
  if (detik === null || detik === undefined) return "-";
  const s = Math.max(0, Math.round(detik));
  if (s < 60) return s + "s";
  const m = Math.floor(s / 60);
  return m + "m " + (s % 60) + "s";
}
function kapan(ts) {
  if (!ts) return "-";
  const lalu = Date.now() / 1000 - ts;
  if (lalu < 60) return "baru saja";
  if (lalu < 3600) return Math.floor(lalu / 60) + " menit lalu";
  if (lalu < 86400) return Math.floor(lalu / 3600) + " jam lalu";
  return new Date(ts * 1000).toLocaleString("id-ID", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
}

/* ── State ───────────────────────────────────────────────────────────── */
let state = { jobs: {}, airbyte: { enabled: false }, user: null };
let tab = "status", job = "split", logJob = "split", logAuto = true;
let pilihanSumber = new Set();   // kosong = semua folder
let sedangKirim = false;

function statusPill(st) {
  if (!st || st.error) return { cls: "warn", text: "tak terjangkau" };
  if (st.running) return { cls: "run", text: "berjalan " + durasi(st.duration_s) };
  if (st.last_finished == null) return { cls: "", text: "idle" };
  return st.last_ok
    ? { cls: "ok",  text: "sukses " + durasi(st.duration_s) }
    : { cls: "err", text: "gagal " + durasi(st.duration_s) };
}

function renderCards() {
  const wrap = $("#cards");
  const urut = ["split", "dbt"];
  wrap.innerHTML = urut.map((nama) => {
    const st = state.jobs[nama] || {};
    const p = statusPill(st);
    const info = st.info || {};
    const baris = [];
    if (st.last_finished) baris.push(`<div><b>Terakhir</b> · ${esc(kapan(st.last_finished))}</div>`);
    if (info.source_home !== undefined)
      baris.push(`<div><b>Home</b> · ${info.source_home ? "<code>" + esc(info.source_home) + "</code>"
        : "<i>tidak dibatasi</i>"}</div>`);
    if (info.sources && info.sources.length)
      baris.push(`<div><b>Sumber</b> · ${info.sources.map((s) => "<code>" + esc(s) + "</code>").join(" ")}</div>`);
    if (info.dest) baris.push(`<div><b>Tujuan</b> · <code>${esc(info.dest)}</code></div>`);
    if (info.interval_menit) baris.push(`<div><b>Jadwal</b> · tiap ${esc(info.interval_menit)} menit</div>`);
    if (st.last_params && st.last_params.select)
      baris.push(`<div><b>Select</b> · <code>${esc(st.last_params.select)}</code></div>`);
    if (nama === "split" && st.info && !("fitur" in info))
      baris.push(`<div style="color:var(--warn)">⚠️ image lama: argumen folder belum didukung</div>`);
    if (st.error) baris.push(`<div style="color:var(--warn)">${esc(st.error)}</div>`);
    return `<div class="card">
        <div class="top"><h2>${esc(nama)}</h2><span class="pill ${p.cls}">${esc(p.text)}</span></div>
        <div class="meta">${baris.join("")}</div>
        <button class="action" data-run="${esc(nama)}" ${st.running ? "disabled" : ""}>
          ${st.running ? "sedang berjalan…" : "▶ Jalankan " + esc(nama)}</button>
      </div>`;
  }).join("") + `<div class="card">
      <div class="top"><h2>Airbyte</h2><span class="pill ${state.airbyte.enabled ? "ok" : "warn"}">
        ${state.airbyte.enabled ? "terkonfigurasi" : "belum diatur"}</span></div>
      <div class="sub">${state.airbyte.enabled
        ? "Picu sync koneksi dari tab Jalankan."
        : "Set AIRBYTE_URL, AIRBYTE_CLIENT_ID, dan AIRBYTE_CLIENT_SECRET di .env."}</div>
    </div>`;

  $$("#cards [data-run]").forEach((b) =>
    b.addEventListener("click", () => { buzz(); jalankan(b.dataset.run, true); }));
}

function renderChips() {
  const info = (state.jobs.split || {}).info || {};
  const sumber = info.sources || [];
  const box = $("#chips-split");
  if (!sumber.length) {
    box.innerHTML = '<span class="sub">Daftar folder belum bisa dibaca dari split-excel.</span>';
    return;
  }
  const semua = pilihanSumber.size === 0;
  box.innerHTML =
    `<button class="chip all" data-src="" aria-pressed="${semua}">Semua (${sumber.length})</button>` +
    sumber.map((s) => {
      const nama = String(s).split("/").filter(Boolean).pop();
      return `<button class="chip" data-src="${esc(s)}" aria-pressed="${pilihanSumber.has(s)}"
                title="${esc(s)}">${esc(nama)}</button>`;
    }).join("");

  $$("#chips-split .chip").forEach((c) => c.addEventListener("click", () => {
    buzz();
    const v = c.dataset.src;
    if (!v) pilihanSumber.clear();
    else if (pilihanSumber.has(v)) pilihanSumber.delete(v);
    else pilihanSumber.add(v);
    renderChips();
    syncMainButton();
  }));
  $("#hint-split").textContent = pilihanSumber.size
    ? pilihanSumber.size + " folder dipilih"
    : "Tanpa pilihan = semua folder di NEXTCLOUD_SOURCE_PATHS.";
}

async function renderSync() {
  const box = $("#sync-body");
  if (!state.airbyte.enabled) {
    box.innerHTML = '<div class="sub" style="margin-top:12px">Airbyte belum dikonfigurasi di .env.</div>';
    return;
  }
  box.innerHTML = '<div class="sub" style="margin-top:12px">Memuat daftar koneksi…</div>';
  try {
    const data = await api("connections");
    const list = data.connections || [];
    if (!list.length) { box.innerHTML = '<div class="sub" style="margin-top:12px">Tidak ada koneksi.</div>'; return; }
    box.innerHTML =
      '<label class="field" for="sync-conn">Koneksi</label><select id="sync-conn">' +
      list.map((k) => `<option value="${esc(k.connectionId)}">${esc(k.name)}${
        k.status && k.status !== "active" ? " (" + esc(k.status) + ")" : ""}</option>`).join("") +
      "</select>";
  } catch (e) {
    if (!fatal) box.innerHTML = `<div class="sub" style="margin-top:12px;color:var(--warn)">${esc(e.message)}</div>`;
  }
  syncMainButton();
}

function renderLog(teks) {
  const el = $("#log");
  const bawah = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
  el.innerHTML = (teks || "(belum ada log)").split("\n").map((b) => {
    const kelas = /ERROR|Traceback|✗|GAGAL/.test(b) ? "e"
                : /WARN|⚠|PERINGATAN/.test(b) ? "w"
                : /^\d{2}:\d{2}:\d{2}/.test(b) ? "t" : "";
    return kelas ? `<span class="${kelas}">${esc(b)}</span>` : esc(b);
  }).join("\n");
  if (bawah) el.scrollTop = el.scrollHeight;
}

/* ── Aksi ────────────────────────────────────────────────────────────── */
function ringkasAksi() {
  if (job === "split")
    return pilihanSumber.size ? `split-excel · ${pilihanSumber.size} folder` : "split-excel · semua folder";
  if (job === "dbt") {
    const sel = $("#dbt-select").value.trim();
    return `dbt ${$("#dbt-cmd").value}` + (sel ? ` --select ${sel}` : "");
  }
  const c = $("#sync-conn");
  return c ? `sync · ${c.selectedOptions[0].textContent}` : "sync";
}

function konfirmasi(pesan) {
  return new Promise((resolve) => {
    if (tg && tg.showConfirm) tg.showConfirm(pesan, resolve);
    else resolve(window.confirm(pesan));
  });
}

async function jalankan(nama, langsung) {
  if (sedangKirim) return;
  const ringkas = langsung ? nama : ringkasAksi();
  if (!(await konfirmasi("Jalankan " + ringkas + "?"))) return;

  sedangKirim = true;
  syncMainButton();
  try {
    let hasil;
    if (nama === "sync") {
      const c = $("#sync-conn");
      if (!c) throw new Error("koneksi belum dipilih");
      hasil = await api("sync", { method: "POST", body: JSON.stringify({ connection_id: c.value }) });
    } else {
      const body = { job: nama };
      if (nama === "split" && !langsung && pilihanSumber.size) body.sources = Array.from(pilihanSumber);
      if (nama === "dbt" && !langsung) {
        body.command = $("#dbt-cmd").value;
        const sel = $("#dbt-select").value.trim();
        if (sel) body.select = sel;
      }
      hasil = await api("run", { method: "POST", body: JSON.stringify(body) });
    }
    notify("success");
    toast(hasil.message || "Job dimulai. Hasilnya dilaporkan ke grup.");
    await muat();
  } catch (e) {
    if (!fatal) { notify("error"); toast("Gagal: " + e.message); }
  } finally {
    sedangKirim = false;
    syncMainButton();
  }
}

/* MainButton hanya hidup di tab Jalankan — tombol utama Telegram jauh lebih
   mudah dijangkau di ponsel daripada tombol di dalam halaman. */
function syncMainButton() {
  if (!tg || !tg.MainButton) return;
  const mb = tg.MainButton;
  if (tab !== "run") { mb.hide(); return; }
  const st = state.jobs[job];
  const sibuk = sedangKirim || (st && st.running);
  mb.setText(sibuk ? "SEDANG BERJALAN…" : "▶ " + ringkasAksi().toUpperCase());
  sibuk ? mb.disable() : mb.enable();
  if (sedangKirim) mb.showProgress(true); else mb.hideProgress();
  mb.show();
}

/* ── Muat data ───────────────────────────────────────────────────────── */
async function muat() {
  if (fatal) return;
  try {
    state = await api("state");
    if (state.user) $("#who").textContent = "@" + (state.user.username || state.user.first_name || "");
    renderCards();
    renderChips();
    syncMainButton();
  } catch (e) {
    if (!fatal) toast("Gagal memuat status: " + e.message);
  }
}

async function muatLog() {
  if (fatal || tab !== "logs") return;
  try {
    const d = await api("logs?job=" + encodeURIComponent(logJob));
    renderLog(d.text);
  } catch (e) {
    if (!fatal) renderLog("Gagal mengambil log: " + e.message);
  }
}

/* Polling adaptif: cepat saat ada job berjalan, lambat saat idle, berhenti
   total saat halaman tidak terlihat — mini app kerap ditinggal terbuka. */
function detak() {
  if (document.hidden) return;
  const sibuk = Object.values(state.jobs || {}).some((s) => s && s.running);
  muat();
  if (logAuto) muatLog();
  clearTimeout(detak.timer);
  detak.timer = setTimeout(detak, sibuk ? 2500 : 8000);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) detak(); });

/* ── Navigasi ────────────────────────────────────────────────────────── */
$$('.tabs [data-tab]').forEach((b) => b.addEventListener("click", () => {
  buzz();
  tab = b.dataset.tab;
  $$('.tabs [data-tab]').forEach((x) => x.setAttribute("aria-selected", String(x === b)));
  ["status", "run", "logs"].forEach((t) => { $("#tab-" + t).hidden = t !== tab; });
  syncMainButton();
  if (tab === "logs") muatLog();
}));

$$('[data-job]').forEach((b) => b.addEventListener("click", () => {
  buzz();
  job = b.dataset.job;
  $$('[data-job]').forEach((x) => x.setAttribute("aria-selected", String(x === b)));
  ["split", "dbt", "sync"].forEach((j) => { $("#pane-" + j).hidden = j !== job; });
  if (job === "sync" && !$("#sync-conn")) renderSync();
  syncMainButton();
}));

$$('[data-log]').forEach((b) => b.addEventListener("click", () => {
  buzz();
  logJob = b.dataset.log;
  $$('[data-log]').forEach((x) => x.setAttribute("aria-selected", String(x === b)));
  muatLog();
}));

$("#log-auto").addEventListener("click", (e) => {
  logAuto = !logAuto;
  e.target.setAttribute("aria-pressed", String(logAuto));
  e.target.textContent = logAuto ? "Auto ⟳" : "Manual";
  if (logAuto) muatLog();
});

["dbt-cmd", "dbt-select"].forEach((id) =>
  $("#" + id).addEventListener("input", syncMainButton));

if (tg && tg.MainButton) tg.MainButton.onClick(() => jalankan(job, false));

muat().then(() => { if (job === "sync") renderSync(); });
detak();
</script>
