apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 30s

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100

  # Warehouse itself, so dashboards can chart analytics.* directly
  # (row counts per kantor, finance rekap, etc.) alongside infra metrics.
  - name: capil_db
    type: postgres
    uid: capil-db
    access: proxy
    url: postgres-db:5432
    user: ${DBT_POSTGRES_USER}
    secureJsonData:
      password: ${DBT_POSTGRES_PW}
    jsonData:
      database: ${DBT_POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1500
      timescaledb: false
