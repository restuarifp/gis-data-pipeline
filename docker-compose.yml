services:
  postgres-db:
    image: postgis/postgis:latest
    restart: always
    container_name: postgres_db
    platform: linux/amd64
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: metabase_db
    ports:
      - 5432:5432
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    networks:
      - gisnet

  metabase:
    image: metabase/metabase:latest
    restart: always
    container_name: metabase
    hostname: metabase
    ports:
      - 3000:3000
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase_db
      MB_DB_PORT: 5432
      MB_DB_USER: admin
      MB_DB_PASS: password123
      MB_DB_HOST: postgres-db
    volumes:
      - ./metabase-data:/metabase-data
    depends_on:
      - postgres-db
    networks:
      - gisnet

  dbt:
    build:
      context: .
      dockerfile: Dockerfile.dbt
    container_name: dbt_worker
    restart: unless-stopped
    volumes:
      - ./dbt:/usr/app/dbt
    environment:
      - DBT_POSTGRES_HOST=postgres-db
      - DBT_POSTGRES_USER=admin
      - DBT_POSTGRES_PW=password123
      - DBT_POSTGRES_DB=capil_db
    depends_on:
      - postgres-db
    profiles: ["cli_only"]
    networks:
      - gisnet

  # Sama dengan service `dbt` di atas, tapi hidup terus dan hanya menjalankan
  # server kontrol job — supaya bot Telegram bisa memicu `dbt run` tanpa akses
  # ke Docker socket. Service `dbt` tetap untuk pemakaian CLI.
  dbt-runner:
    build:
      context: .
      dockerfile: Dockerfile.dbt
    container_name: dbt_runner
    restart: unless-stopped
    working_dir: /usr/app
    command: ["python", "dbt_control.py"]
    volumes:
      - ./dbt:/usr/app/dbt
    environment:
      - DBT_POSTGRES_HOST=postgres-db
      - DBT_POSTGRES_USER=admin
      - DBT_POSTGRES_PW=password123
      - DBT_POSTGRES_DB=capil_db
    depends_on:
      - postgres-db
    networks:
      - gisnet

  split-excel:
    build:
      context: .
      dockerfile: Dockerfile.split-excel
    container_name: split_excel
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - gisnet

  notif-relay:
    build:
      context: .
      dockerfile: Dockerfile.notif-relay
    container_name: notif_relay
    # on-failure (not unless-stopped): a missing TELEGRAM_* in .env is a config
    # error, and retrying it forever just floods the logs. Real crashes still
    # get 3 restarts.
    restart: on-failure:3
    env_file:
      - .env
    ports:
      - ${NOTIF_RELAY_PORT:-8000}:${NOTIF_RELAY_PORT:-8000}
    networks:
      - gisnet

  onlyoffice-docs:
    image: onlyoffice/documentserver:9.3.1.1
    container_name: onlyoffice-docs
    restart: always
    ports:
      - 8080:80
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=susSyf-dihdaq-7xudfa
      - JWT_HEADER=Authorization
    volumes:
      - oo_data:/var/www/onlyoffice/Data
      - oo_log:/var/log/onlyoffice
      - oo_cache:/var/lib/onlyoffice
      - oo_db:/var/lib/postgresql
    networks:
      - gisnet

  # ---------------------------------------------------------------- observability
  # All under the "observability" profile so `docker compose up -d` keeps
  # starting only the core stack. Bring them up with:
  #   docker compose --profile observability up -d
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    ports:
      - 9090:9090
    profiles: ["observability"]
    networks:
      - gisnet

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Referenced by the provisioned capil_db datasource
      DBT_POSTGRES_USER: ${DBT_POSTGRES_USER:-admin}
      DBT_POSTGRES_PW: ${DBT_POSTGRES_PW:-password123}
      DBT_POSTGRES_DB: ${DBT_POSTGRES_DB:-capil_db}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - ${GRAFANA_PORT:-3030}:3000
    depends_on:
      - prometheus
      - loki
    profiles: ["observability"]
    networks:
      - gisnet

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - 3100:3100
    profiles: ["observability"]
    networks:
      - gisnet

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_positions:/tmp
    depends_on:
      - loki
    profiles: ["observability"]
    networks:
      - gisnet

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      # plain :ro (not rslave) — WSL2 mounts / as private, which rejects rslave
      - /:/host:ro
    profiles: ["observability"]
    networks:
      - gisnet

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    profiles: ["observability"]
    networks:
      - gisnet

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password123}@postgres-db:5432/postgres?sslmode=disable"
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres-exporter/queries.yml
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "true"
      PG_EXPORTER_EXCLUDE_DATABASES: "template0,template1"
    volumes:
      - ./observability/prometheus/postgres-queries.yml:/etc/postgres-exporter/queries.yml:ro
    depends_on:
      - postgres-db
    profiles: ["observability"]
    networks:
      - gisnet

networks:
  gisnet:
    driver: bridge

volumes:
  oo_data:
  oo_log:
  oo_cache:
  oo_db:
  prom_data:
  grafana_data:
  loki_data:
  promtail_positions: