services:
  postgres-db:
    image: postgis/postgis:latest
    restart: always
    container_name: postgres_db
    platform: linux/amd64
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: metabase_db
    ports:
      - 5432:5432
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    networks:
      - gisnet

  metabase:
    # Di-pin ke digest, bukan :latest — image inilah yang terakhir menulis app DB
    # metabase_db, dan migrasi skema Metabase bersifat satu arah (tidak bisa turun
    # versi). Dengan digest, `docker compose pull` tidak bisa menaikkannya diam-diam.
    image: metabase/metabase@sha256:1357996e0a877530ccbdb1a1fa6d3a128e4f2f24245f0a63e37ce9e02f35307c
    restart: always
    container_name: metabase
    hostname: metabase
    ports:
      - 3000:3000
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase_db
      MB_DB_PORT: 5432
      MB_DB_USER: admin
      MB_DB_PASS: password123
      MB_DB_HOST: postgres-db
    volumes:
      - ./metabase-data:/metabase-data
    depends_on:
      - postgres-db
    networks:
      - gisnet

  dbt:
    build:
      context: .
      dockerfile: Dockerfile.dbt
    container_name: dbt_worker
    restart: unless-stopped
    volumes:
      - ./dbt:/usr/app/dbt
    environment:
      - DBT_POSTGRES_HOST=postgres-db
      - DBT_POSTGRES_USER=admin
      - DBT_POSTGRES_PW=password123
      - DBT_POSTGRES_DB=capil_db
    depends_on:
      - postgres-db
    profiles: ["cli_only"]
    networks:
      - gisnet

  # Sama dengan service `dbt` di atas, tapi hidup terus dan hanya menjalankan
  # server kontrol job — supaya bot Telegram bisa memicu `dbt run` tanpa akses
  # ke Docker socket. Service `dbt` tetap untuk pemakaian CLI.
  dbt-runner:
    build:
      context: .
      dockerfile: Dockerfile.dbt
    container_name: dbt_runner
    restart: unless-stopped
    working_dir: /usr/app
    command: ["python", "dbt_control.py"]
    volumes:
      - ./dbt:/usr/app/dbt
    environment:
      - DBT_POSTGRES_HOST=postgres-db
      - DBT_POSTGRES_USER=admin
      - DBT_POSTGRES_PW=password123
      - DBT_POSTGRES_DB=capil_db
    depends_on:
      - postgres-db
    networks:
      - gisnet

  split-excel:
    build:
      context: .
      dockerfile: Dockerfile.split-excel
    container_name: split_excel
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - gisnet

  notif-relay:
    build:
      context: .
      dockerfile: Dockerfile.notif-relay
    container_name: notif_relay
    # on-failure (not unless-stopped): a missing TELEGRAM_* in .env is a config
    # error, and retrying it forever just floods the logs. Real crashes still
    # get 3 restarts.
    restart: on-failure:3
    env_file:
      - .env
    ports:
      - ${NOTIF_RELAY_PORT:-8000}:${NOTIF_RELAY_PORT:-8000}
    networks:
      - gisnet

  onlyoffice-docs:
    image: onlyoffice/documentserver:9.3.1.1
    container_name: onlyoffice-docs
    restart: always
    ports:
      - 8080:80
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=susSyf-dihdaq-7xudfa
      - JWT_HEADER=Authorization
    volumes:
      - oo_data:/var/www/onlyoffice/Data
      - oo_log:/var/log/onlyoffice
      - oo_cache:/var/lib/onlyoffice
      - oo_db:/var/lib/postgresql
    networks:
      - gisnet

  # NOTE: Stack observability (Prometheus, Grafana, Loki, Promtail, node-exporter,
  # cAdvisor, postgres-exporter) dulu ada di sini dan kini TIDAK dideploy di server
  # ini sama sekali. Di mesin pengembang mereka dijalankan machine-wide dari
  # /home/eq/development/observability lewat network eksternal gis-data-pipeline_gisnet;
  # jalur itu tidak ada di server produksi. Metabase sempat ikut dihapus atas dasar
  # catatan yang sama dan itu keliru — Metabase dilayani dari sini (lihat service di atas).

networks:
  gisnet:
    driver: bridge

volumes:
  oo_data:
  oo_log:
  oo_cache:
  oo_db: