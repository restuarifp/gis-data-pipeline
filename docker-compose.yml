services:
  postgres-db:
    image: postgis/postgis:latest
    restart: always
    container_name: postgres_db
    platform: linux/amd64
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: metabase_db
    ports:
      - 5432:5432
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    networks:
      - gisnet

  dbt:
    build:
      context: .
      dockerfile: Dockerfile.dbt
    container_name: dbt_worker
    restart: unless-stopped
    volumes:
      - ./dbt:/usr/app/dbt
    environment:
      - DBT_POSTGRES_HOST=postgres-db
      - DBT_POSTGRES_USER=admin
      - DBT_POSTGRES_PW=password123
      - DBT_POSTGRES_DB=capil_db
    depends_on:
      - postgres-db
    profiles: ["cli_only"]
    networks:
      - gisnet

  # Sama dengan service `dbt` di atas, tapi hidup terus dan hanya menjalankan
  # server kontrol job — supaya bot Telegram bisa memicu `dbt run` tanpa akses
  # ke Docker socket. Service `dbt` tetap untuk pemakaian CLI.
  dbt-runner:
    build:
      context: .
      dockerfile: Dockerfile.dbt
    container_name: dbt_runner
    restart: unless-stopped
    working_dir: /usr/app
    command: ["python", "dbt_control.py"]
    volumes:
      - ./dbt:/usr/app/dbt
    environment:
      - DBT_POSTGRES_HOST=postgres-db
      - DBT_POSTGRES_USER=admin
      - DBT_POSTGRES_PW=password123
      - DBT_POSTGRES_DB=capil_db
    depends_on:
      - postgres-db
    networks:
      - gisnet

  split-excel:
    build:
      context: .
      dockerfile: Dockerfile.split-excel
    container_name: split_excel
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - gisnet

  notif-relay:
    build:
      context: .
      dockerfile: Dockerfile.notif-relay
    container_name: notif_relay
    # on-failure (not unless-stopped): a missing TELEGRAM_* in .env is a config
    # error, and retrying it forever just floods the logs. Real crashes still
    # get 3 restarts.
    restart: on-failure:3
    env_file:
      - .env
    ports:
      - ${NOTIF_RELAY_PORT:-8000}:${NOTIF_RELAY_PORT:-8000}
    networks:
      - gisnet

  onlyoffice-docs:
    image: onlyoffice/documentserver:9.3.1.1
    container_name: onlyoffice-docs
    restart: always
    ports:
      - 8080:80
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=susSyf-dihdaq-7xudfa
      - JWT_HEADER=Authorization
    volumes:
      - oo_data:/var/www/onlyoffice/Data
      - oo_log:/var/log/onlyoffice
      - oo_cache:/var/lib/onlyoffice
      - oo_db:/var/lib/postgresql
    networks:
      - gisnet

  # NOTE: Metabase and the observability stack (Prometheus, Grafana, Loki,
  # Promtail, node-exporter, cAdvisor, postgres-exporter) used to live here.
  # They now run machine-wide from /home/eq/development/observability and
  # join this project via the external `gis-data-pipeline_gisnet` network.
  # The named volumes prom_data/grafana_data/loki_data/promtail_positions are
  # still owned by this project and are consumed there as external volumes.

networks:
  gisnet:
    driver: bridge

volumes:
  oo_data:
  oo_log:
  oo_cache:
  oo_db: